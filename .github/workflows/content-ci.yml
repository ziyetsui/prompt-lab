name: Content CI

on:
  pull_request:
    paths:
      - "content/**"
      - "schemas/**"
      - "lib/**"
      - "governance/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/content-ci.yml"
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "schemas/**"
      - "lib/**"
      - "governance/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/content-ci.yml"

permissions:
  contents: read

concurrency:
  group: content-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify canonical content contract
        run: npm run verify
